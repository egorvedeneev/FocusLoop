services:
  postgres:
    image: postgres:16
    container_name: focusloop-postgres
    environment:
      POSTGRES_DB: focusloop
      POSTGRES_USER: focusloop
      POSTGRES_PASSWORD: focusloop
    ports:
      - "5432:5432"
    volumes:
      - focusloop-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focusloop -d focusloop"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
    container_name: focusloop-backend
    environment:
      DATABASE_URL: postgresql+psycopg://focusloop:focusloop@postgres:5432/focusloop
      BACKEND_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DEFAULT_USER_EMAIL: local@focusloop.dev
      DEFAULT_USER_NAME: Local User
      SEED_ON_START: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: "../FocusLoop Web App-4"
    container_name: focusloop-frontend
    environment:
      VITE_API_BASE_URL: /api/v1
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  focusloop-postgres-data:
